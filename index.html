ion{font-size:21px;line-height:1.55;font-weight:750;margin:18px 0 22px}.option{display:flex;align-items:center;gap:12px;padding:16px 14px;margin:10px 0;width:100%;text-align:left;line-height:1.5;font-size:15px}.option .letter{background:#eef3f6;border-radius:9px;padding:8px 10px;font-weight:700;color:#526b7b}.option.correct{border-color:#21a178;background:#effbf5}.option.wrong{border-color:#df746d;background:#fff1f0}.option:disabled{cursor:default;color:inherit}.explain{background:#edf5f7;border-left:4px solid #1c8ba6;padding:14px 16px;border-radius:10px;margin:16px 0;line-height:1.7;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e1e9ee;padding:10px 4px max(12px,env(safe-area-inset-bottom));box-shadow:0 -5px 22px #0a29390d}.bottom button{border:0;background:transparent;color:#82939c;font-size:11px;padding:4px}.bottom button.active{color:#087d9d;font-weight:750}.bottom .ico{display:block;font-size:22px;margin-bottom:4px}.alert{padding:14px;background:#fff8e9;border-color:#f2e1bd;font-size:12px;line-height:1.7;color:#77552b}.tag{font-size:11px;color:#8a6c42;background:#fff5e3;border-radius:6px;padding:4px 7px}.blank{text-align:center;padding:42px 15px;color:#6c8390}.actionrow{display:flex;gap:10px;flex-wrap:wrap}.actionrow>*{flex:1}.review{padding:15px 0;border-bottom:1px solid #e5ebee}.review strong{display:block;line-height:1.5;margin-bottom:6px}.review button{margin-top:9px}.score{text-align:center;font-size:50px;color:#147f9b;font-weight:800;margin:18px 0 4px}.sub{font-size:12px;color:#879ba5}.smallbtn{background:none;border:none;color:#147c9a;font-weight:700;padding:7px 0}input[type=checkbox]{accent-color:#147f9b} .filter{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.filter button{white-space:nowrap;border:1px solid #d5e3e9;background:white;border-radius:20px;padding:8px 12px;color:#4b6978}.filter button.on{background:#166e8a;color:white}.divider{height:1px;background:#e6ecef;margin:16px 0}

.bird-growth{position:relative;background:linear-gradient(145deg,#fff,#eef7fc);border-color:#d4e7f1;padding:18px}.bird-growth h2{font-size:18px;margin:0}.growth-kicker{font-size:11px;color:#51758a;margin-top:5px}.growth-level{font-size:12px;background:#dceff8;color:#176782;padding:5px 9px;border-radius:20px;white-space:nowrap}.growth-stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:18px 0 16px;position:relative}.growth-stage{text-align:center;min-width:0;border:1px solid transparent;border-radius:13px;padding:10px 2px;position:relative;background:#ffffff80}.growth-stage .bird{display:block;font-size:30px;line-height:1.4;filter:grayscale(1);opacity:.4}.growth-stage .bird-name{display:block;font-size:12px;font-weight:650;margin-top:5px;color:#8a9da9;white-space:nowrap}.growth-stage .bird-threshold{display:block;font-size:10px;color:#8096a4;line-height:1.6;margin-top:3px}.growth-stage.unlocked .bird{filter:none;opacity:.8}.growth-stage.unlocked .bird-name{color:#486c80}.growth-stage.current{background:white;border-color:#68afcd;box-shadow:0 3px 12px #1c7ca115}.growth-stage.current .bird{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}.growth-stage.current .bird-name{color:#116783}.stage-lock{position:absolute;right:3px;top:3px;font-size:9px;color:#8e9fa8}.growth-stage:not(:last-child)::after{content:'→';position:absolute;right:-9px;top:27px;font-size:12px;z-index:1;color:#9db8c6}.growth-track{height:7px;border-radius:20px;background:#dce9ef;overflow:hidden;margin:10px 0}.growth-track span{display:block;height:100%;background:linear-gradient(90deg,#176d91,#5bb8df);border-radius:inherit;transition:width .35s ease}.growth-description{margin:10px 0 0;font-size:12px;line-height:1.7;color:#40687d}.growth-footnote{margin:10px 0 0;padding-top:10px;border-top:1px solid #dce9f0;font-size:10px;line-height:1.7;color:#758e9c}.growth-count{font-size:12px;color:#486d81}.growth-mini .bird{font-size:36px;margin-right:12px}.growth-mini-title{font-weight:700;color:#174a64}.growth-mini{padding:17px}.growth-celebration{position:fixed;z-index:1000;left:50%;top:22px;transform:translateX(-50%);width:min(350px,calc(100vw - 28px));padding:17px 20px;background:#113c54;color:white;border:1px solid #8dc9e5;border-radius:18px;box-shadow:0 10px 40px #143d5430;text-align:center;animation:growth-enter .35s ease-out}.growth-celebration p{margin:5px 0;font-size:13px;color:#c9e5f3}.growth-celebration strong{font-size:17px}.growth-animation{position:relative;height:55px;margin:2px 0 8px}.growth-old,.growth-new{position:absolute;left:calc(50% - 24px);top:0;font-size:39px}.growth-old{animation:bird-old .8s both}.growth-new{animation:bird-up 1.2s .35s both}.growth-toast-close{position:absolute;right:8px;top:5px;border:0;background:transparent;color:#c9e5f3;font-size:21px;padding:2px 7px}.growth-spark{position:absolute;left:calc(50% + 34px);top:2px;font-size:17px;animation:spark-up 1s .5s both}.growth-celebration .cert-note{font-size:10px;color:#9dc4d7;margin-top:9px}@keyframes growth-enter{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes bird-old{0%,25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6) translateY(8px)}}@keyframes bird-up{0%{opacity:0;transform:translateY(15px) scale(.5)}45%{opacity:1;transform:translateY(-7px) scale(1.2) rotate(-8deg)}75%{transform:translateY(0) scale(1) rotate(5deg)}100%{opacity:1;transform:translateY(-2px) scale(1.08)}}@keyframes spark-up{from{opacity:0;transform:translateY(10px) scale(.3)}50%{opacity:1}to{opacity:0;transform:translateY(-18px) scale(1.2)}}@media(max-width:360px){.bird-growth{padding:14px}.growth-stages{gap:5px}.growth-stage .bird{font-size:27px}.growth-level{font-size:11px}.bird-growth h2{font-size:16px}}@media(prefers-reduced-motion:reduce){.growth-celebration,.growth-old,.growth-new,.growth-spark{animation:none}.growth-old{display:none}.growth-new{opacity:1}.growth-track span{transition:none}}

const Q=[{"id": 1, "cat": "空气动力学", "q": "滑翔比 8:1 表示什么？", "opts": ["水平前进8米，下降约1米", "每秒下降8米", "水平前进1米，下降8米", "每小时飞行8公里"], "a": 0, "why": "滑翔比是静止空气中水平距离与下降高度之比；实际地面航程还受风影响。", "src": "空气动力学·14", "level": "基础", "tag": "已核对基础概念"}, {"id": 2, "cat": "空气动力学", "q": "攻角是指哪两个方向之间的夹角？", "opts": ["伞翼与地面", "翼弦与相对气流", "飞行员与伞绳", "山坡与水平线"], "a": 1, "why": "攻角（Angle of Attack）是翼弦与相对气流的夹角，不是伞翼对地面的角度。", "src": "空气动力学·15（原题表述待修正）", "level": "基础", "tag": "已核对基础概念"}, {"id": 3, "cat": "空气动力学", "q": "空速是指飞行器相对于什么的速度？", "opts": ["地面", "周围空气", "GPS卫星", "山坡"], "a": 1, "why": "空速与地速不同，风会改变地速。", "src": "空气动力学·23", "level": "基础", "tag": "已核对基础概念"}, {"id": 4, "cat": "空气动力学", "q": "滑翔伞的升力主要来自什么？", "opts": ["伞翼与气流的相互作用", "仅仅是迎风阻力", "伞绳自身拉力", "副伞"], "a": 0, "why": "伞翼在相对气流中产生气动力，其中垂直于相对气流的分量称为升力。", "src": "空气动力学·1（概念修订）", "level": "基础", "tag": "已核对基础概念"}, {"id": 5, "cat": "空气动力学", "q": "空气动力合力可以分解为哪两种分量？", "opts": ["升力与阻力", "重量与浮力", "地速与空速", "风速与阵风"], "a": 0, "why": "升力垂直于相对气流方向，阻力平行且反向于相对气流。", "src": "空气动力学·52", "level": "基础", "tag": "已核对基础概念"}, {"id": 6, "cat": "空气动力学", "q": "在其他条件近似不变时，动压与空速是什么关系？", "opts": ["与空速平方成正比", "与空速成反比", "不受空速影响", "与空速平方成反比"], "a": 0, "why": "动压 q = 1/2 ρV²，空速增加会显著增加动压；实际升阻力还与系数、面积等有关。", "src": "空气动力学·39", "level": "基础", "tag": "已核对基础概念"}, {"id": 7, "cat": "空气动力学", "q": "攻角过大时，可能出现哪种危险？", "opts": ["失速", "自动获得最大滑翔比", "完全没有变化", "伞翼自动打开副伞"], "a": 0, "why": "超过翼型可维持附着流动的范围时，可能发生气流分离与失速。", "src": "空气动力学·35", "level": "基础", "tag": "已核对基础概念"}, {"id": 8, "cat": "空气动力学", "q": "滑翔伞的刹车绳通常连接到哪里？", "opts": ["后缘", "前缘进气口", "副伞", "胸带"], "a": 0, "why": "刹车绳作用于伞翼后缘；不同伞型的具体布置需查手册。", "src": "飞行技术与装备·197", "level": "基础", "tag": "已核对基础概念"}, {"id": 9, "cat": "空气动力学", "q": "最大滑翔比主要表示什么？", "opts": ["最佳水平航程与高度损失之比", "最大允许风速", "最大起飞重量", "最大转弯角度"], "a": 0, "why": "最大滑翔比是性能指标，不代表任何风况下都能获得相同的地面航程。", "src": "空气动力学·33/34（改写）", "level": "基础", "tag": "已核对基础概念"}, {"id": 10, "cat": "空气动力学", "q": "拉动刹车通常会对伞翼产生什么影响？", "opts": ["后缘下偏并改变升阻力", "只改变GPS地速", "完全不影响翼型", "自动消除所有乱流"], "a": 0, "why": "刹车改变后缘形状、阻力与升力特性；过度输入可能导致失速。", "src": "飞行技术与装备·189（概念修订）", "level": "基础", "tag": "已核对基础概念"}, {"id": 11, "cat": "空气动力学", "q": "相同空速下，空气密度降低通常会使动压怎样变化？", "opts": ["降低", "增加", "完全不变", "必定变为零"], "a": 0, "why": "由 q=1/2 ρV²，密度降低时动压降低。", "src": "空气动力学·36（延伸）", "level": "基础", "tag": "已核对基础概念"}, {"id": 12, "cat": "空气动力学", "q": "伞翼相对飞行员向前或向后摆动称为什么？", "opts": ["俯仰运动", "偏航角", "地面滑行", "热力环流"], "a": 0, "why": "俯仰描述前后方向的姿态/摆动，和滚转、偏航不同。", "src": "空气动力学·概念扩展", "level": "基础", "tag": "已核对基础概念"}, {"id": 13, "cat": "气象知识", "q": "大气中与多数滑翔伞天气活动最相关的层次是？", "opts": ["对流层", "平流层顶", "热层", "外逸层"], "a": 0, "why": "对流层包含主要天气现象、云和大部分水汽。", "src": "气象·3", "level": "基础", "tag": "已核对基础概念"}, {"id": 14, "cat": "气象知识", "q": "相对湿度达到100%时，空气通常称为？", "opts": ["饱和", "绝对干燥", "真空", "超音速"], "a": 0, "why": "相对湿度100%表示在该温度下接近饱和状态，但不等于一定已经降水。", "src": "气象·10", "level": "基础", "tag": "已核对基础概念"}, {"id": 15, "cat": "气象知识", "q": "在标准大气的对流层低层，温度随高度上升通常如何变化？", "opts": ["总体下降", "恒定不变", "每100米升高10℃", "必然迅速升高"], "a": 0, "why": "国际标准大气对流层温度递减率约6.5℃/千米；实际大气可能逆温。", "src": "气象·18", "level": "基础", "tag": "已核对基础概念"}, {"id": 16, "cat": "气象知识", "q": "下列哪一种云常与雷暴相关？", "opts": ["积雨云", "卷云", "晴空", "薄层高云"], "a": 0, "why": "积雨云可伴随雷电、强阵风、降水、冰雹与强烈上升下降气流，应远离。", "src": "气象·100/101", "level": "基础", "tag": "已核对基础概念"}, {"id": 17, "cat": "气象知识", "q": "风通常由什么物理机制驱动？", "opts": ["气压梯度力并受地转偏向力与摩擦等影响", "只有太阳直射", "只有海浪", "只有湿度"], "a": 0, "why": "空气流动受气压梯度力等作用；近地面还受摩擦与地形显著影响。", "src": "气象·38/39（概念修订）", "level": "基础", "tag": "已核对基础概念"}, {"id": 18, "cat": "气象知识", "q": "等压线非常密集，通常提示什么？", "opts": ["气压梯度较大，可能有较强风", "一定无风", "空气一定饱和", "气温一定升高"], "a": 0, "why": "在其他条件相近时，等压线密集常对应更强的水平气压梯度。", "src": "气象·37", "level": "基础", "tag": "已核对基础概念"}, {"id": 19, "cat": "气象知识", "q": "山地背风侧为什么需要格外谨慎？", "opts": ["可能存在下沉气流和转子乱流", "风一定比迎风侧稳定", "总能获得上升气流", "没有风向变化"], "a": 0, "why": "地形会产生复杂的背风乱流、下沉气流和转子；危险区域依地形风况变化。", "src": "气象·82/83/91", "level": "基础", "tag": "已核对基础概念"}, {"id": 20, "cat": "气象知识", "q": "冷锋接近时，下列哪项是合理的风险判断？", "opts": ["可能有阵风、风向变化与对流天气", "一定是理想飞行窗口", "风一定归零", "绝对不会降雨"], "a": 0, function save(){localStorage.setItem(K,JSON.stringify(db))}function el(s){document.getElementById('app').innerHTML=s}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nav(){return '<nav class="bottom">'+[['home','⌂','首页'],['topics','▤','章节'],['wrong','↻','错题'],['mine','◉','我的']].map(([id,ico,t])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${t}</button>`).join('')+'</nav>'}
function shell(title,body,hero=false){el((hero?`<header class="hero"><h1>🪂 起飞吧 <span class="brand-en">ParaPilot</span></h1><p>从走地鸡，到真正的飞行员。</p></header>`:`<header class="hero"><h1>${title}</h1><p>起飞吧 · ParaPilot · 滑翔伞理论学习</p></header>`)+`<main class="wrap">${body}</main>`+nav())}
function go(v){view=v;render();scrollTo(0,0)}function pct(a,b){return b?Math.round(100*a/b):0}
function render(){if(view==='home'){let mastered=Object.keys(db.answers).length;let correct=Object.entries(db.answers).filter(([id,a])=>Q.find(q=>q.id==id)?.a===a).length;shell('',`<div class="eyebrow">今日学习概览</div><div class="stats"><div class="stat"><strong>${Q.length}</strong><span>首版题目</span></div><div class="stat"><strong>${mastered}</strong><span>已练习</span></div><div class="stat"><strong>${db.wrong.length}</strong><span>待复习错题</span></div></div>${growthPanel()}<div class="panel"><h2>开始学习</h2><p class="muted">先练习基础理论，再用模拟考试检验掌握程度。</p><div class="actionrow"><button class="primary" onclick="start('practice',Q.map(x=>x.id))">顺序刷题</button><button class="secondary" onclick="start('exam',shuffle(Q.map(x=>x.id)).slice(0,20))">模拟考试 · 20题</button></div></div><div class="eyebrow" style="margin-top:24px">章节专项</div>${topics()}<div class="alert">⚠️ 安全说明：这是学习与记忆工具，不是实时飞行指导。部分原始教材有待核实，题目已按基础原理改写；训练场专用流程须由教练确认。</div>`,true)}else if(view==='topics'){shell('章节练习',topics()+`<div class="alert">章节题目为截图资料提炼的首批样题，并非完整原始题库。</div>`)}else if(view==='wrong'){let ids=db.wrong;shell('错题本',ids.length?`<p class="muted">错题会保留，直到你主动移除或答对复习题。</p><button class="primary wide" onclick="start('practice',${JSON.stringify(ids)})">复习全部错题（${ids.length}）</button>${ids.map(id=>reviewCard(Q.find(q=>q.id===id))).join('')}`:`<div class="blank">🎉 暂时没有错题<br><small>做题后，答错的题会自动收录在这里。</small></div>`)}else if(view==='mine'){let attempts=db.attempts;let n=Object.keys(db.answers).length;shell('学习档案',`<div class="stats"><div class="stat"><strong>${n}</strong><span>已练习题</span></div><div class="stat"><strong>${db.star.length}</strong><span>收藏题</span></div><div class="stat"><strong>${attempts.length}</strong><span>考试次数</span></div></div>${growthPanel(true)}<div class="panel"><h2>收藏夹</h2>${db.star.length?`<button class="primary wide" onclick="start('practice',${JSON.stringify(db.star)})">练习收藏题</button>${db.star.map(id=>reviewCard(Q.find(q=>q.id===id))).join('')}`:'<p class="muted">还没有收藏题目。在答题页点 ☆ 即可收藏。</p>'}</div><div class="panel"><h2>模拟考试记录</h2>${attempts.length?attempts.slice().reverse().slice(0,10).map(x=>`<div class="review">${esc(x.date)} · <b>${x.score}/${x.total}</b> · ${pct(x.score,x.total)}%</div>`).join(''):'<p class="muted">还没有考试记录。</p>'}</div><button class="secondary wide" onclick="exportData()">导出学习记录（JSON）</button><p class="muted">学习数据保存在当前浏览器；清理浏览器数据可能导致记录丢失。</p>`)}else if(view==='quiz'){renderQuiz()}else if(view==='result'){renderResult()}}
function topics(){return cats.map(([c,e])=>`<button class="topic" onclick="start('practice',${JSON.stringify(Q.filter(q=>q.cat===c).map(q=>q.id))})"><span class="emoji">${e}</span><span><strong>${c}</strong><small>${Q.filter(q=>q.cat===c).length} 道题 · 章节练习</small></span><span class="arr">›</span></button>`).join('')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m,ids){if(!ids.length){alert('本章节暂无题目');return}mode=m;session=ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);pos=0;selected=null;result=null;view='quiz';render();scrollTo(0,0)}
function choose(i){if(selected!==null)return;const growthBefore=growthState().index;selected=i;let q=session[pos];if(mode==='practice'){db.answers[q.id]=i;if(i!==q.a&&!db.wrong.includes(q.id))db.wrong.push(q.id);if(i===q.a)db.wrong=db.wrong.filter(id=>id!==q.id);save()}else{result=result||{};result[q.id]=i}renderQuiz();if(mode==='practice')announceGrowth(growthBefore)}
function next(){const growthBefore=growthState().index;if(pos<session.length-1){pos++;selected=mode==='exam'?(result||{})[session[pos].id]??null:null;render();scrollTo(0,0)}else{if(mode==='exam'){let score=session.filter(q=>result?.[q.id]===q.a).length;db.attempts.push({date:new Date().toLocaleString('zh-CN'),score,total:session.length});session.forEach(q=>{let a=result?.[q.id];if(a!==undefined){db.answers[q.id]=a;if(a!==q.a&&!db.wrong.includes(q.id))db.wrong.push(q.id);if(a===q.a)db.wrong=db.wrong.filter(id=>id!==q.id)}});save()}view='result';render();scrollTo(0,0);if(mode==='exam')announceGrowth(growthBefore)}}
function star(id){db.star=db.star.includes(id)?db.star.filter(x=>x!==id):[...db.star,id];save();renderQuiz()}
function renderQuiz(){let q=session[pos],show=mode==='practice'&&selected!==null;let label=mode==='exam'?'模拟考试':'章节练习';shell(label,`<div class="row"><span class="pill">${esc(q.cat)}</span><span class="sub">${pos+1} / ${session.length}</span></div><div class="progress"><div style="width:${pct(pos+1,session.length)}%"></div></div><div class="row"><span class="sub">${esc(q.src)}</span><button class="smallbtn" onclick="star(${q.id})">${db.star.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button></div><div class="question">${esc(q.q)}</div>${q.opts.map((o,i)=>`<button class="option ${show?(i===q.a?'correct':i===selected?'wrong':''):''}" onclick="choose(${i})" ${selected!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span>${show&&i===q.a?' ✓':''}</button>`).join('')}${show?`<div class="explain"><strong>${selected===q.a?'✓ 回答正确':'✕ 回答错误 · 正确答案 '+ 'ABCD'[q.a]}</strong><div>${esc(q.why)}</div><div class="sub" style="margin-top:8px">${esc(q.tag)}</div></div>`:''}${selected!==null?`<button class="primary wide" onclick="next()">${pos===session.length-1?'完成练习':'下一题 →'}</button>`:`<p class="muted">${mode==='exam'?'模拟考试提交后统一显示成绩和解析。':'请选择一个答案，立即查看解析。'}</p>`}<p class="muted" style="margin-top:20px">教材来源：${esc(q.src)}。学习用途，不代替教练或装备手册。</p>`)}
function renderResult(){let total=session.length;let score=session.filter(q=>(mode==='exam'?result?.[q.id]:db.answers[q.id])===q.a).length;shell('练习完成',`<div class="panel"><div class="score">${pct(score,total)}%</div><p style="text-align:center"><strong>答对 ${score} / ${total} 题</strong></p><p class="muted" style="text-align:center">${mode==='exam'?'模拟考试成绩已保存':'这一轮练习结束啦！'}</p><div class="actionrow"><button class="primary" onclick="start('${mode}',${JSON.stringify(session.map(q=>q.id))})">再练一次</button><button class="secondary" onclick="go('home')">返回首页</button></div></div><div class="panel"><h2>本轮答题回顾</h2>${session.map(q=>{let a=mode==='exam'?result?.[q.id]:db.answers[q.id];return `<div class="review"><strong>${esc(q.q)}</strong><div class="muted">你的答案：${a===undefined?'未答':'ABCD'[a]} · 正确答案：${'ABCD'[q.a]} ${a===q.a?'✓':'✕'}</div><div class="muted">${esc(q.why)}</div></div>`}).join('')}</div>`)}
function reviewCard(q){if(!q)return '';return `<div class="review"><strong>${esc(q.q)}</strong><span class="sub">${esc(q.cat)} · ${esc(q.src)}</span><div><button class="smallbtn" onclick="start('practice',[${q.id}])">重新练习 →</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download='ParaPilot-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

// Count distinct existing question IDs whose latest saved answer is correct.
// No separate XP counter and no writes when calculating or rendering levels.
function growthState(){const questions=[...new Map(Q.map(q=>[String(q.id),q])).values()];const total=questions.length;const mastered=questions.reduce((n,q)=>n+(Object.prototype.hasOwnProperty.call(db.answers,String(q.id))&&db.answers[q.id]===q.a?1:0),0);const thresholds=[0,...[.2,.5,.85].map(r=>total?Math.max(1,Math.ceil(total*r)):1)];let index=0;if(total)thresholds.forEach((t,i)=>{if(mastered>=t)index=i});return {total,mastered,thresholds,index,next:thresholds[index+1],percent:total?Math.round(mastered/total*100):0}}
function growthPanel(compact=false){const g=growthState();const names=['走地鸡','练习鸟','起飞鸟','老鸟'];const birds=['🐥','🐤','🐦','🦅'];if(compact)return `<section class="panel bird-growth growth-mini" aria-label="当前理论成长等级"><div class="row"><div style="display:flex;align-items:center"><span class="bird" aria-hidden="true">${birds[g.index]}</span><div><div class="growth-mini-title">Lv.${g.index+1} · ${names[g.index]}</div><div class="growth-kicker">已掌握 ${g.mastered} / ${g.total} 题</div></div></div><span class="growth-level">理论成长</span></div><p class="growth-footnote">等级仅代表理论学习进度，不代表真实飞行技术或资格认证。</p></section>`;return `<section class="panel bird-growth" aria-label="成为老鸟的路上"><div class="row"><div><h2>成为老鸟的路上</h2><div class="growth-kicker">理论学扎实，成长看得见</div></div><span class="growth-level">Lv.${g.index+1} · ${names[g.index]}</span></div><div class="growth-stages">${names.map((name,i)=>`<div class="growth-stage ${i<=g.index?'unlocked':'locked'} ${i===g.index?'current':''}" ${i===g.index?'aria-current="step"':''} aria-label="${name}，${i===g.index?'当前阶段':i<g.index?'已解锁':'未解锁'}，${g.thresholds[i]}题起"><span class="bird" aria-hidden="true">${birds[i]}</span><span class="bird-name">${name}</span><span class="bird-threshold">${g.thresholds[i]}题起</span>${i>g.index?'<span class="stage-lock" aria-hidden="true">🔒</span>':''}</div>`).join('')}</div><div class="row growth-count"><span>理论掌握 ${g.mastered} / ${g.total} 题</span><span>${g.percent}%</span></div><div class="growth-track" role="progressbar" aria-label="理论题目掌握进度" aria-valuemin="0" aria-valuemax="${Math.max(1,g.total)}" aria-valuenow="${g.mastered}"><span style="width:${g.percent}%"></span></div><p class="growth-description">${!g.total?'题库添加后即可开始成长。':g.index<3?`再掌握 <strong>${g.next-g.mastered}</strong> 道不同题目，解锁${birds[g.index+1]} ${names[g.index+1]}。`:`🦅 已到达老鸟阶段！${g.mastered<g.total?`还有 ${g.total-g.mastered} 题等你继续巩固。`:'全部题目已答对，记得常来复习。'}`}</p><p class="growth-footnote">按不同题目最近一次保存的答案计算，重复答对不叠加；门槛随题库数量调整。等级仅代表理论学习进度，不代表真实飞行技术或资格认证。</p></section>`}
function announceGrowth(before){const g=growthState();if(g.index<=before)return;const names=['走地鸡','练习鸟','起飞鸟','老鸟'],birds=['🐥','🐤','🐦','🦅'];const messages=['','翅膀热身好了，练习鸟报到！','理论积累到位，起飞鸟上线！','理论老鸟达成，继续稳稳学！'];document.querySelector('.growth-celebration')?.remove();const toast=document.createElement('aside');toast.className='growth-celebration';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');toast.innerHTML=`<button class="growth-toast-close" aria-label="关闭成长提示" onclick="this.parentElement.remove()">×</button><div class="growth-animation" aria-hidden="true"><span class="growth-old">${birds[before]}</span><span class="growth-new">${birds[g.index]}</span><span class="growth-spark">✦</span></div><strong>升级啦 · ${names[g.index]}</strong><p>${messages[g.index]}</p><div class="cert-note">理论学习成长，不代表飞行能力认证</div>`;document.body.appendChild(toast);setTimeout(()=>toast.remove(),4200)}

render();
</script></body></html>
