const Q=[{"id": 1, "cat": "空气动力学", "q": "静止空气中，滑翔比8:1表示什么？", "opts": ["每秒下降8米", "每秒前进8米", "前进8米，下降1米", "前进1米，下降8米"], "a": 2, "why": "结论：8:1表示水平前进8米约损失1米高度。为什么：在静止空气、稳定滑翔的条件下，滑翔比与升阻比相关。适用条件：这是性能关系，逆风、下沉气流和操纵会改变实际对地航程。误区：不能据此保证剩余高度一定够飞到目标。", "src": "空气动力学·14", "level": "基础", "tag": "基础原理与NASA资料相符", "original_question": "滑翔比 8:1 表示什么？", "original_answer": 0, "verified_answer": 2, "status": "基础原理与NASA资料相符", "evidence": [{"title": "NASA：升阻比与气动力公式", "url": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/lift-to-drag-ratio/"}], "previous_wording": {"q": "滑翔比 8:1 表示什么？", "opts": ["水平前进8米，下降约1米", "每秒下降8米", "水平前进1米，下降8米", "每小时飞行8公里"], "a": 0}}, {"id": 2, "cat": "空气动力学", "q": "攻角是哪两个方向的夹角？", "opts": ["伞绳与垂直线", "翼弦与水平线", "翼弦与相对气流", "航迹与水平线"], "a": 2, "why": "攻角（Angle of Attack）是翼弦与相对气流的夹角，不是伞翼对地面的角度。", "src": "空气动力学·15（原题表述待修正）", "level": "基础", "tag": "沿用原应用答案 · 待独立核验", "original_question": "攻角是指哪两个方向之间的夹角？", "original_answer": 1, "verified_answer": null, "status": "沿用原应用答案 · 待独立核验", "evidence": [], "previous_wording": {"q": "攻角是指哪两个方向之间的夹角？", "opts": ["伞翼与地面", "翼弦与相对气流", "飞行员与伞绳", "山坡与水平线"], "a": 1}}, {"id": 3, "cat": "空气动力学", "q": "空速以什么为参照？", "opts": ["海平面", "地面", "周围空气", "起飞点"], "a": 2, "why": "空速与地速不同，风会改变地速。", "src": "空气动力学·23", "level": "基础", "tag": "沿用原应用答案 · 待独立核验", "original_question": "空速是指飞行器相对于什么的速度？", "original_answer": 1, "verified_answer": null, "status": "沿用原应用答案 · 待独立核验", "evidence": [], "previous_wording": {"q": "空速是指飞行器相对于什么的速度？", "opts": ["地面", "周围空气", "GPS卫星", "山坡"], "a": 1}}, {"id": 4, "cat": "空气动力学", "q": "伞翼产生升力，需要什么？", "opts": ["仅靠伞绳张力", "仅靠飞行员重量", "伞翼与空气的相对运动", "仅靠内部充气"], "a": 2, "why": "伞翼与周围空气存在相对运动，形成压力分布和气流方向变化，从而产生气动力。升力是其中垂直于相对气流的分量。", "src": "空气动力学·1（概念修订）", "level": "基础", "tag": "基础原理与NASA资料相符", "original_question": "滑翔伞的升力主要来自什么？", "original_answer": 0, "verified_answer": 2, "status": "基础原理与NASA资料相符", "evidence": [{"title": "NASA：升阻比与气动力公式", "url": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/lift-to-drag-ratio/"}], "pr function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m,ids){if(!ids.length){alert('本章节暂无题目');return}mode=m;session=ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);pos=0;selected=null;result={};view='quiz';render();scrollTo(0,0)}

function startUnseen(ids){const valid=ids.filter(id=>Q.some(q=>q.id===id));const remaining=valid.filter(id=>!Object.prototype.hasOwnProperty.call(db.answers,id));if(remaining.length){start('practice',remaining);return}if(!valid.length){alert('本章节暂无题目');return}const items=valid.map(id=>Q.find(q=>q.id===id)),sameChapter=items.every(q=>q.cat===items[0].cat),title=sameChapter?items[0].cat:'全部题库',wrong=valid.filter(id=>db.wrong.includes(id));view='topics';shell('这一组已完成',`<section class="panel"><h2>${esc(title)}</h2><p class="muted">已做 ${valid.length}/${valid.length} 题，完成度 100%。你可以重刷，或到错题本巩固。</p><button class="primary wide" onclick="start('practice',${JSON.stringify(valid)})">${sameChapter?'重刷本章':'重刷全部题库'}</button>${wrong.length?`<button class="secondary wide" style="margin-top:12px" onclick="start('practice',${JSON.stringify(wrong)})">复习本组错题（${wrong.length}题）</button>`:''}<button class="smallbtn" style="margin-top:14px" onclick="go('topics')">返回章节列表</button></section>`);scrollTo(0,0)}
function choose(i){if(selected!==null)return;const growthBefore=growthState().index;selected=i;let q=session[pos];result=result||{};result[q.id]=i;if(mode==='practice'){db.answers[q.id]=i;if(i!==q.a&&!db.wrong.includes(q.id))db.wrong.push(q.id);if(i===q.a)db.wrong=db.wrong.filter(id=>id!==q.id);save()}else{result=result||{};result[q.id]=i}renderQuiz();if(mode==='practice')announceGrowth(growthBefore)}
function next(){const growthBefore=growthState().index;if(pos<session.length-1){pos++;selected=(result||{})[session[pos].id]??null;render();scrollTo(0,0)}else{if(mode==='exam'){let score=session.filter(q=>result?.[q.id]===q.a).length;db.attempts.push({date:new Date().toLocaleString('zh-CN'),score,total:session.length});session.forEach(q=>{let a=result?.[q.id];if(a!==undefined){db.answers[q.id]=a;if(a!==q.a&&!db.wrong.includes(q.id))db.wrong.push(q.id);if(a===q.a)db.wrong=db.wrong.filter(id=>id!==q.id)}});save()}view='result';render();scrollTo(0,0);if(mode==='exam')announceGrowth(growthBefore)}}
function prev(){if(pos===0)return;pos--;selected=(result||{})[session[pos].id]??null;render();scrollTo(0,0)}
function star(id){db.star=db.star.includes(id)?db.star.filter(x=>x!==id):[...db.star,id];save();renderQuiz()}
function renderQuiz(){let q=session[pos],show=mode==='practice'&&selected!==null;let label=mode==='exam'?'模拟考试':'章节练习';shell(label,`<div class="row"><span class="pill">${esc(q.cat)}</span><span class="sub">${pos+1} / ${session.length}</span></div><div class="progress"><div style="width:${pct(pos+1,session.length)}%"></div></div><div class="row"><span class="sub">${esc(q.src)}</span><button class="smallbtn" onclick="star(${q.id})">${db.star.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button></div><div class="question">${esc(q.q)}</div>${classicFigure(q)}${q.opts.map((o,i)=>`<button class="option ${show?(i===q.a?'correct':i===selected?'wrong':''):''}" onclick="choose(${i})" ${selected!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span class="option-text">${esc(o)}</span>${show&&i===q.a?' ✓':''}</button>`).join('')}${show?`<div class="explain"><strong>${selected===q.a?'✓ 回答正确':'✕ 回答错误 · 正确答案 '+ 'ABCD'[q.a]}</strong><div>${esc(q.why)}</div><div class="sub" style="margin-top:8px">${esc(q.tag)}</div></div>`:''}${selected===null?`<p class="muted">${mode==='exam'?'模拟考试提交后统一显示成绩和解析。':'请选择一个答案，立即查看解析。'}</p>`:''}<div class="quiz-navigation" aria-label="题目导航"><button class="secondary" onclick="prev()" ${pos===0?'disabled':''}>← 上一题</button><button class="primary" onclick="next()" ${selected===null?'disabled':''}>${pos===session.length-1?(mode==='exam'?'交卷并查看成绩':'完成练习'):'下一题 →'}</button></div><p class="muted" style="margin-top:20px">教材来源：${esc(q.src)}。学习用途，不代替教练或装备手册。</p>`)}
function renderResult(){let total=session.length;let score=session.filter(q=>result?.[q.id]===q.a).length;shell('练习完成',`<div class="panel"><div class="score">${pct(score,total)}%</div><p style="text-align:center"><strong>答对 ${score} / ${total} 题</strong></p><p class="muted" style="text-align:center">${mode==='exam'?'模拟考试成绩已保存':'这一轮练习结束啦！'}</p><div class="actionrow"><button class="primary" onclick="start('${mode}',${JSON.stringify(session.map(q=>q.id))})">再练一次</button><button class="secondary" onclick="go('home')">返回首页</button></div></div><div class="panel"><h2>本轮答题回顾</h2>${session.map(q=>{let a=result?.[q.id];return `<div class="review"><strong>${esc(q.q)}</strong><div class="muted">你的答案：${a===undefined?'未答':'ABCD'[a]} · 正确答案：${'ABCD'[q.a]} ${a===q.a?'✓':'✕'}</div><div class="muted">${esc(q.why)}</div></div>`}).join('')}</div>`)}
function reviewCard(q){if(!q)return '';return `<div class="review"><strong>${esc(q.q)}</strong><span class="sub">${esc(q.cat)} · ${esc(q.src)}</span><div><button class="smallbtn" onclick="start('practice',[${q.id}])">重新练习 →</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download='ParaPilot-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

// Count distinct existing question IDs whose latest saved answer is correct.
// No separate XP counter and no writes when calculating or rendering levels.
function growthState(){const questions=[...new Map(Q.map(q=>[String(q.id),q])).values()];const total=questions.length;const mastered=questions.reduce((n,q)=>n+(Object.prototype.hasOwnProperty.call(db.answers,String(q.id))&&db.answers[q.id]===q.a?1:0),0);const thresholds=[0,...[.2,.5,.85].map(r=>total?Math.max(1,Math.ceil(total*r)):1)];let index=0;if(total)thresholds.forEach((t,i)=>{if(mastered>=t)index=i});return {total,mastered,thresholds,index,next:thresholds[index+1],percent:total?Math.round(mastered/total*100):0}}
function growthPanel(compact=false){const g=growthState();const names=['走地鸡','练习鸟','起飞鸟','老鸟'];const birds=['🐥','🐤','🐦','🦅'];if(compact)return `<section class="panel bird-growth growth-mini" aria-label="当前理论成长等级"><div class="row"><div style="display:flex;align-items:center"><span class="bird" aria-hidden="true">${birds[g.index]}</span><div><div class="growth-mini-title">Lv.${g.index+1} · ${names[g.index]}</div><div class="growth-kicker">已掌握 ${g.mastered} / ${g.total} 题</div></div></div><span class="growth-level">理论成长</span></div><p class="growth-footnote">等级仅代表理论学习进度，不代表真实飞行技术或资格认证。</p></section>`;return `<section class="panel bird-growth" aria-label="成为老鸟的路上"><div class="row"><div><h2>成为老鸟的路上</h2><div class="growth-kicker">理论学扎实，成长看得见</div></div><span class="growth-level">Lv.${g.index+1} · ${names[g.index]}</span></div><div class="growth-stages">${names.map((name,i)=>`<div class="growth-stage ${i<=g.index?'unlocked':'locked'} ${i===g.index?'current':''}" ${i===g.index?'aria-current="step"':''} aria-label="${name}，${i===g.index?'当前阶段':i<g.index?'已解锁':'未解锁'}，${g.thresholds[i]}题起"><span class="bird" aria-hidden="true">${birds[i]}</span><span class="bird-name">${name}</span><span class="bird-threshold">${g.thresholds[i]}题起</span>${i>g.index?'<span class="stage-lock" aria-hidden="true">🔒</span>':''}</div>`).join('')}</div><div class="row growth-count"><span>理论掌握 ${g.mastered} / ${g.total} 题</span><span>${g.percent}%</span></div><div class="growth-track" role="progressbar" aria-label="理论题目掌握进度" aria-valuemin="0" aria-valuemax="${Math.max(1,g.total)}" aria-valuenow="${g.mastered}"><span style="width:${g.percent}%"></span></div><p class="growth-description">${!g.total?'题库添加后即可开始成长。':g.index<3?`再掌握 <strong>${g.next-g.mastered}</strong> 道不同题目，解锁${birds[g.index+1]} ${names[g.index+1]}。`:`🦅 已到达老鸟阶段！${g.mastered<g.total?`还有 ${g.total-g.mastered} 题等你继续巩固。`:'全部题目已答对，记得常来复习。'}`}</p><p class="growth-footnote">按不同题目最近一次保存的答案计算，重复答对不叠加；门槛随题库数量调整。等级仅代表理论学习进度，不代表真实飞行技术或资格认证。</p></section>`}
function announceGrowth(before){const g=growthState();if(g.index<=before)return;const names=['走地鸡','练习鸟','起飞鸟','老鸟'],birds=['🐥','🐤','🐦','🦅'];const messages=['','翅膀热身好了，练习鸟报到！','理论积累到位，起飞鸟上线！','理论老鸟达成，继续稳稳学！'];document.querySelector('.growth-celebration')?.remove();const toast=document.createElement('aside');toast.className='growth-celebration';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');toast.innerHTML=`<button class="growth-toast-close" aria-label="关闭成长提示" onclick="this.parentElement.remove()">×</button><div class="growth-animation" aria-hidden="true"><span class="growth-old">${birds[before]}</span><span class="growth-new">${birds[g.index]}</span><span class="growth-spark">✦</span></div><strong>升级啦 · ${names[g.index]}</strong><p>${messages[g.index]}</p><div class="cert-note">理论学习成长，不代表飞行能力认证</div>`;document.body.appendChild(toast);setTimeout(()=>toast.remove(),4200)}
